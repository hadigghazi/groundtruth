name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fit:
        description: "Refit the pass-difficulty and xG models"
        type: boolean
        default: false
      seeds:
        description: "Seeds for the calibration run"
        default: "7 8 9 10"
      detector:
        description: "Score the tactical-shift detector against the truth log"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,api,agents]"
      - run: pytest -q --durations=5

  image:
    # The server image: Python API + agents + the web app (TypeScript is type-checked in the build).
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    # Staging on dblp-vm until the Azure deployment exists. Skips itself until the VM secrets are set.
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-vm-pitchside
    permissions:
      contents: read
      packages: read
    env:
      HAS_HOST: ${{ secrets.VM_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Not configured yet
        if: env.HAS_HOST != 'true'
        run: echo "VM_HOST secret is not set - skipping deploy. The image is on GHCR."
      - name: Prepare SSH
        if: env.HAS_HOST == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy compose file
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'mkdir -p ~/pitchside'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/pitchside/docker-compose.prod.yml"
      - name: Pull and restart
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            set -e
            cd ~/pitchside
            touch .env
            set_env() {
              [ -n "$2" ] || return 0
              grep -v "^$1=" .env > .env.next || true
              echo "$1=$2" >> .env.next
              mv .env.next .env
            }
            set_env OPENAI_API_KEY '${{ secrets.OPENAI_API_KEY }}'
            set_env PITCHSIDE_LLM '${{ vars.PITCHSIDE_LLM }}'
            set_env PITCHSIDE_MODEL_LARGE '${{ vars.PITCHSIDE_MODEL_LARGE }}'
            set_env PITCHSIDE_MODEL_SMALL '${{ vars.PITCHSIDE_MODEL_SMALL }}'
            chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f >/dev/null
          EOF
      - name: Smoke test
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8082/api/health && curl -fsS -o /dev/null http://127.0.0.1:8082/ && { echo; echo "pitchside is up"; exit 0; }
              sleep 2
            done
            docker logs --tail 50 pitchside; exit 1
          EOF

  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Simulate and print totals
        run: pitchside calibrate --seeds ${{ github.event.inputs.seeds || '7 8 9 10' }}

  fit:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pitchside fit-models --train 16 --test 4 --workers 4 --write coefficients.json | tee fit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            coefficients.json
            fit-report.json

  detector:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.detector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pitchside detector-report --workers 4 --write detector.json | tee detector-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: detector
          path: |
            detector-report.json
            detector.json

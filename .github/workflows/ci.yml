name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fit:
        description: "Refit the pass-difficulty and xG models"
        type: boolean
        default: false
      seeds:
        description: "Seeds for the calibration run"
        default: "7 8 9 10"
      detector:
        description: "Score the tactical-shift detector against the truth log"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -q --durations=5

  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Simulate and print totals
        run: pitchside calibrate --seeds ${{ github.event.inputs.seeds || '7 8 9 10' }}

  fit:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pitchside fit-models --train 16 --test 4 --workers 4 --write coefficients.json | tee fit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            coefficients.json
            fit-report.json

  detector:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.detector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pitchside detector-report --workers 4 --write-thresholds detector.json | tee detector-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: detector
          path: |
            detector-report.json
            detector.json

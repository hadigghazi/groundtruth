name: ci

# A push runs only the Python tests, and only when Python code changes (the web app has its
# own workflow, web.yml; deployment is deploy.yml). Everything heavier runs by hand:
#   gh workflow run ci.yml -f ui=true        screenshots of every screen
#   gh workflow run ci.yml -f distributed=true   the roles over the emulators
# A newer push cancels an older run still going.

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml"]
  workflow_dispatch:
    inputs:
      test:
        description: "Run the Python tests"
        type: boolean
        default: false
      image:
        description: "Build the server image (and push it to GHCR)"
        type: boolean
        default: false
      ui:
        description: "Screenshot every screen in headless Chromium"
        type: boolean
        default: false
      distributed:
        description: "Run the roles as separate processes against the emulators"
        type: boolean
        default: false
      infra:
        description: "Compile the Bicep"
        type: boolean
        default: false
      calibrate:
        description: "Simulate matches and print totals; run the scripted agent evaluation and auto-eventing"
        type: boolean
        default: false
      seeds:
        description: "Seeds for the calibration run"
        default: "7 8 9 10"
      fit:
        description: "Refit the pass-difficulty and xG models"
        type: boolean
        default: false
      detector:
        description: "Score the tactical-shift detector against the truth log"
        type: boolean
        default: false
      learn:
        description: "Train the learned detector (about 200 simulated matches) and score it against the rule"
        type: boolean
        default: false
      vision:
        description: "Train the video detector on rendered broadcast frames and grade auto-eventing"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,api,agents]"
      - run: pytest -q --durations=5

  image:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'true'
    # The server image: Python API + agents + the web app (TypeScript is type-checked in the build).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  ui:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ui == 'true'
    # Runs the built app in headless Chromium and screenshots every screen (artifact "screens").
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: groundtruth:ci
          cache-from: type=gha,scope=app
      - run: docker run -d --name gt -p 8000:8000 groundtruth:ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Screenshots, English and Arabic, desktop and phone
        working-directory: web
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          BASE=http://localhost:8000 OUT=shots node e2e/screens.mjs
      - name: Server log
        if: always()
        run: docker logs gt 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: web/shots

  distributed:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.distributed == 'true'
    # The roles as separate processes over the real Azure SDKs, against the Event Hubs, Cosmos DB
    # and Storage emulators: a match end to end, then a worker killed mid-match and replaced.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: docker compose -f infra/emulators/compose.yml up -d
      - run: pip install -e ".[api,agents,azure]" azure-storage-blob
      - name: Wait for the emulators
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 3; done
          sleep 20  # the Event Hubs emulator needs its metadata store up first
          docker compose -f infra/emulators/compose.yml ps
      - run: python scripts/distributed_check.py
      - name: Role logs
        if: always()
        run: |
          for f in role-*.log; do echo "=== $f"; tail -40 "$f"; done
          docker compose -f infra/emulators/compose.yml logs --tail 30 eventhubs cosmos

  infra:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.infra == 'true'
    # Compile the Bicep so template errors show up on every push, deployed or not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null && echo "infra/main.bicep compiles"

  calibrate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.calibrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[agents]"
      - name: Simulate and print totals
        run: groundtruth calibrate --seeds ${{ github.event.inputs.seeds || '7 8 9 10' }}
      - name: Events from positions alone, scored against the event log
        run: groundtruth autoevent --seeds 7 8 | head -30
      - name: Agent evaluation harness, scripted (the real-model run needs Azure)
        run: groundtruth eval-agents --seeds 400 401 --speed 0 --llm scripted --concurrency 2 | head -40

  fit:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: set -o pipefail; groundtruth fit-models --train 16 --test 4 --workers 4 --write coefficients.json | tee fit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            coefficients.json
            fit-report.json

  vision:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.vision == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[vision]"
      - run: mkdir -p vision-out && set -o pipefail && groundtruth vision --out vision-out | tee vision-out/stdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision
          path: vision-out

  learn:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.learn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: set -o pipefail; groundtruth learn-detector --workers 4 --write learned.json | tee learned-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: learned
          path: |
            learned.json
            learned-report.json

  detector:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.detector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: set -o pipefail; groundtruth detector-report --workers 4 --write detector.json | tee detector-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: detector
          path: |
            detector-report.json
            detector.json

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fit:
        description: "Refit the pass-difficulty and xG models"
        type: boolean
        default: false
      seeds:
        description: "Seeds for the calibration run"
        default: "7 8 9 10"
      detector:
        description: "Score the tactical-shift detector against the truth log"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,api,agents]"
      - run: pytest -q --durations=5

  image:
    # The server image: Python API + agents + the web app (TypeScript is type-checked in the build).
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  ui:
    # Runs the built app in headless Chromium and screenshots every screen (artifact "screens").
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: groundtruth:ci
          cache-from: type=gha,scope=app
      - run: docker run -d --name gt -p 8000:8000 groundtruth:ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Screenshots, English and Arabic, desktop and phone
        working-directory: web
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          BASE=http://localhost:8000 OUT=shots node e2e/screens.mjs
      - name: Server log
        if: always()
        run: docker logs gt 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: web/shots

  infra:
    # Compile the Bicep so template errors show up on every push, deployed or not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null && echo "infra/main.bicep compiles"

  azure:
    # Provision with Bicep, push the image to the registry, roll out, smoke-test.
    # Skips itself until the bootstrap script's three secrets are set.
    needs: [test, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: azure-deploy
    permissions:
      id-token: write
      contents: read
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      RG: groundtruth-rg
    steps:
      - uses: actions/checkout@v4
      - name: Not configured yet
        if: env.HAS_AZURE != 'true'
        run: echo "AZURE_CLIENT_ID is not set - run infra/bootstrap.sh in Azure Cloud Shell first. Skipping."
      - uses: azure/login@v2
        if: env.HAS_AZURE == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision services (everything but the app)
        if: env.HAS_AZURE == 'true'
        run: |
          AI_USER=$(az role definition list --name "Azure AI User" --query "[0].name" -o tsv || true)
          echo "AI_USER=$AI_USER" >> "$GITHUB_ENV"
          az deployment group create -g "$RG" -n "base-${{ github.run_number }}" -f infra/main.bicep \
            -p aiUserRoleId="$AI_USER" ${{ vars.BICEP_PARAMS }} --query properties.outputs -o json > outputs.json
          echo "REGISTRY=$(jq -r .registryName.value outputs.json)" >> "$GITHUB_ENV"
          echo "SERVER=$(jq -r .registryServer.value outputs.json)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_AZURE == 'true'
      - name: Log in to the registry
        if: env.HAS_AZURE == 'true'
        run: az acr login --name "$REGISTRY"
      - uses: docker/build-push-action@v6
        if: env.HAS_AZURE == 'true'
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.SERVER }}/groundtruth:${{ github.sha }}
          cache-from: type=gha,scope=app
      - name: Roll out the app
        if: env.HAS_AZURE == 'true'
        run: |
          az deployment group create -g "$RG" -n "app-${{ github.run_number }}" -f infra/main.bicep \
            -p aiUserRoleId="$AI_USER" appImage="$SERVER/groundtruth:${{ github.sha }}" ${{ vars.BICEP_PARAMS }} -o none
          FQDN=$(az containerapp show -g "$RG" -n groundtruth --query properties.configuration.ingress.fqdn -o tsv)
          echo "URL=https://$FQDN" >> "$GITHUB_ENV"
          echo "### Live at https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        if: env.HAS_AZURE == 'true'
        run: |
          for i in $(seq 1 40); do
            curl -fsS "$URL/api/health" && curl -fsS -o /dev/null "$URL/" && { echo; echo "up at $URL"; exit 0; }
            sleep 6
          done
          az containerapp logs show -g "$RG" -n groundtruth --tail 50 || true
          exit 1

  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[agents]"
      - name: Simulate and print totals
        run: groundtruth calibrate --seeds ${{ github.event.inputs.seeds || '7 8 9 10' }}
      - name: Events from positions alone, scored against the event log
        run: groundtruth autoevent --seeds 7 8 | head -30
      - name: Agent evaluation harness, scripted (the real-model run needs Azure)
        run: groundtruth eval-agents --seeds 400 401 --speed 0 --llm scripted --concurrency 2 | head -40

  fit:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: groundtruth fit-models --train 16 --test 4 --workers 4 --write coefficients.json | tee fit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            coefficients.json
            fit-report.json

  detector:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.detector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: groundtruth detector-report --workers 4 --write detector.json | tee detector-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: detector
          path: |
            detector-report.json
            detector.json

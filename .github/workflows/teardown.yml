name: teardown

# Deletes the whole GroundTruth resource group on Azure. Permanent. On demand only, and only
# when the confirmation input is exactly DELETE.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to remove every GroundTruth resource on Azure"
        required: true

jobs:
  teardown:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      RG: groundtruth-rg
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete the resource group
        run: |
          az resource list -g "$RG" --query "[].{name:name, type:type}" -o table
          FOUNDRY=$(az cognitiveservices account list -g "$RG" --query "[0].name" -o tsv)
          echo "FOUNDRY=$FOUNDRY" >> "$GITHUB_ENV"
          az group delete -n "$RG" --yes
          echo "resource group still exists: $(az group exists -n "$RG")"
      - name: Purge the AI account from the recycle bin
        run: |
          az cognitiveservices account purge -l swedencentral -g "$RG" -n "$FOUNDRY" \
            && echo "purged $FOUNDRY" || echo "could not purge $FOUNDRY from here; it needs a subscription-level role"

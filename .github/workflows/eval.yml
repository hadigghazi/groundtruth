name: eval

# The agent team on real Foundry models, graded against the hidden truth on held-out matches.
# On demand only: each variant costs about a dollar of tokens and twenty runner minutes.

on:
  workflow_dispatch:
    inputs:
      tactician:
        description: "Deployments to try as the Tactician (space-separated): tactician = gpt-5-mini, writer = gpt-4.1-mini, candidate = gpt-4o"
        default: "writer candidate"
      effort:
        description: "Reasoning effort for a reasoning-model Tactician (minimal, low, medium)"
        default: "minimal"
      speed:
        description: "Replay speed; the agents work in wall-clock time"
        default: "12"

jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: echo "list=$(printf '%s\n' ${{ inputs.tactician }} | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  eval:
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1 # the variants share the writer deployment's rate limit
      matrix:
        tactician: ${{ fromJson(needs.variants.outputs.list) }}
    env:
      RG: groundtruth-rg
      GROUNDTRUTH_LLM: foundry
      GROUNDTRUTH_MODEL_LARGE: ${{ matrix.tactician }}
      GROUNDTRUTH_MODEL_SMALL: writer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[agents,azure]" azure-ai-evaluation
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Point at the Foundry project
        run: |
          ACCOUNT=$(az cognitiveservices account list -g "$RG" --query "[?kind=='AIServices'].name | [0]" -o tsv)
          echo "FOUNDRY_PROJECT_ENDPOINT=https://$ACCOUNT.services.ai.azure.com/api/projects/groundtruth-studio" >> "$GITHUB_ENV"
          # groundedness, relevance and coherence of every verified card, graded by gpt-4.1-mini
          echo "AZURE_OPENAI_ENDPOINT=https://$ACCOUNT.openai.azure.com/" >> "$GITHUB_ENV"
          echo "GROUNDTRUTH_EVAL_DEPLOYMENT=writer" >> "$GITHUB_ENV"
          # reasoning effort applies to the reasoning model only
          if [ "${{ matrix.tactician }}" = "tactician" ]; then
            echo "GROUNDTRUTH_REASONING_EFFORT=${{ inputs.effort }}" >> "$GITHUB_ENV"
          fi
      - name: Score the team
        run: |
          set -o pipefail
          groundtruth eval-agents --speed ${{ inputs.speed }} --concurrency 6 --write eval-${{ matrix.tactician }}.json | tail -60
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(f"eval-{os.environ['GROUNDTRUTH_MODEL_LARGE']}.json"))
          print(f"### Tactician = {os.environ['GROUNDTRUTH_MODEL_LARGE']}")
          print("```json"); print(json.dumps({k: v for k, v in r.items() if not isinstance(v, list)}, indent=1)[:4000]); print("```")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.tactician }}
          path: eval-*.json

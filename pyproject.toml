[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth"
version = "0.1.0"
description = "Live, explainable match intelligence from synthetic football data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hadi Ghazi" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pydantic>=2.7", "pyarrow>=16"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "mcp>=1.9,<2"]
agents = ["agent-framework-core>=1.21", "agent-framework-openai>=1.16"]
azure = ["agent-framework-foundry>=1.14", "azure-identity>=1.17", "microsoft-opentelemetry"]

[project.scripts]
groundtruth = "groundtruth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
groundtruth = ["stats/*.json"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchside"
version = "0.1.0"
description = "Live, explainable match intelligence from synthetic football data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hadi Ghazi" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pydantic>=2.7", "pyarrow>=16"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pitchside = "pitchside.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pitchside = ["stats/*.json"]

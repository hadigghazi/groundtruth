# The Azure services GroundTruth uses, as local emulators, for CI and for running the
# distributed roles on a laptop:  docker compose -f infra/emulators/compose.yml up -d
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000", "10001:10001", "10002:10002"]
  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    depends_on: [azurite]
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    volumes: ["./eventhubs.json:/Eventhubs_Emulator/ConfigFiles/Config.json"]
    ports: ["5672:5672"]
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    environment:
      PROTOCOL: http
    ports: ["8081:8081"]
